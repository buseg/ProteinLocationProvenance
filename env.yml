# Pipeline env "locx" (never contains vLLM; the pipeline talks to vLLM over HTTP).
name: locx
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      - requests
      - openai
      - "pydantic>=2"
      - rdflib
      - pyshacl
      - obonet
      - pysbd
      - rapidfuzz
      - pandas
      - pyyaml
      - streamlit
      - matplotlib
      - tqdm
