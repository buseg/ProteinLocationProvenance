# Pipeline env "locx" (never contains vLLM; the pipeline talks to vLLM over HTTP).
name: locx
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      - requests
      - openai
      - "pydantic>=2"
      - rdflib
      - pyshacl
      - obonet
      - pysbd
      - rapidfuzz
      - pandas
      - pyyaml
      - streamlit
      - matplotlib
      - pyvis==0.3.2
      - tqdm
      - owlrl                # OWL 2 RL checks on the Protégé sample (comes with pyshacl; listed explicitly)
      - owlready2==0.51      # bundles the HermiT OWL 2 DL reasoner (runs on the Java 21 used by Fuseki)
