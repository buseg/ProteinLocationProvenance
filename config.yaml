fuseki:
  base: http://localhost:3030          # on the server; Buse uses the SSH tunnel
  dataset: locx
  user: admin
  password_env: FUSEKI_ADMIN_PASSWORD  # read from .env, never stored here
graphs:
  go_cc: urn:locx:graph:go-cc
  goa: urn:locx:graph:goa-human
  uniprot: urn:locx:graph:uniprot-human
  papers: urn:locx:graph:papers
  assertions: urn:locx:graph:assertions
  verdicts: urn:locx:graph:verdicts
  run_prefix: urn:locx:graph:run/
llm:
  model: google/gemma-4-31B-it-qat-w4a16-ct
  served_name: gemma4-31b
  gpu: 1                                     # the one GPU this project uses (DECISIONS 2026-11-16)
  endpoint: http://localhost:8000/v1
  concurrency: 48
  temperature: 0.0
  max_tokens: 1500
corpus:
  dev_per_protein: 25
  dev_years: [2015, 2026]
  discovery_years: [2023, 2026]
  discovery_cap: 3000      # MVP; expanded set (10000) built 2026-11-16, on hold
  discovery_cap_expanded: 10000
  discovery_max_screen_per_year: 8000
  discovery_stratify: year # cap split evenly over discovery_years (DECISIONS 2026-11-16)
  silver_sample: 1000      # MVP; expanded set (5000) on hold
  silver_sample_expanded: 5000
  seed: 13
  dev_seeds:               # symbol: names used in the Europe PMC query (SPEC M3.1)
    TP53: ["p53", "TP53"]
    TFEB: ["TFEB"]
    YAP1: ["YAP", "YAP1"]
    CTNNB1: ["beta-catenin", "β-catenin"]
    FOXO3: ["FOXO3", "FOXO3a"]
    NFE2L2: ["NRF2", "NFE2L2"]
    PKM: ["PKM2"]
    STAT3: ["STAT3"]
candidates:
  max_proteins: 15
  max_locations: 15
  stoplist: [ER, cell, body, complex]
silver:
  evidence_low_throughput: [EXP, IDA, IPI, IMP, IGI, IEP]
  evidence_high_throughput: [HTP, HDA, HMP, HGI, HEP]
extract:
  main_run: gemma4-31b_20261116-1655   # MVP full run (prompt v2); used by validate / rdf / verdicts
